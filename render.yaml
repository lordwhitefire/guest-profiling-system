# Render deployment configuration for the Guest Profiling System
# =============================================================================
# Owner decision (2026-11-18): no paid Render. This is the free shape.
#
#   - Render free web service runs the Next.js app
#   - Neon holds all three databases (clean + two hotel sources)
#   - The sync timer lives on Neon, not on Render (Render free has no cron)
#
# Free-tier consequences, stated plainly:
#   - the web service spins down after 15 minutes idle; first visit is slow
#   - 750 instance-hours per month
#   - no Render database, no Render cron, no backups
#
# How to deploy:
#   1. Push the repo to GitHub
#   2. In Render, "New +" -> "Blueprint" -> select the repo
#   3. Set the secret environment variables in the dashboard
#
# Required environment variables (set in Render dashboard):
#   - DATABASE_URL         Neon gps URL (direct endpoint, search_path=public)
#   - SOURCE_PMS_URL       Neon pms URL, read-only role
#   - SOURCE_PMS_TYPE      qloapps
#   - JWT_SECRET           openssl rand -hex 32
#   - ARGON2_PEPPER        openssl rand -hex 32
#   - FIELD_ENCRYPTION_KEY openssl rand -hex 32 (must match the key used to
#                          encrypt adapter_connections)
#   - DEFAULT_TENANT_ID    seeded Grand Vista tenant id
#   - NEXT_PUBLIC_APP_URL  the service's onrender.com URL, set after first deploy

services:
  - type: web
    name: gps-core
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @gps/core build
    startCommand: pnpm --filter @gps/core start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false             # Neon gps database
      - key: SOURCE_PMS_URL
        sync: false             # Neon pms database (read-only role)
      - key: SOURCE_PMS_TYPE
        value: qloapps
      - key: JWT_SECRET
        sync: false
      - key: ARGON2_PEPPER
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: DEFAULT_TENANT_ID
        value: "11111111-1111-1111-1111-111111111111"
      - key: NEXT_PUBLIC_APP_URL
        sync: false             # set after the first deploy creates the URL