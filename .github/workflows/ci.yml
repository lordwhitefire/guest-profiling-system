name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      # Build-time only. No real connection is opened.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ARGON2_PEPPER: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  unit-tests:
    name: Unit tests (Vitest + pg-mem)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: packages/*/coverage/
          retention-days: 7

  integration-tests:
    name: Integration tests (local Postgres)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: choose-a-password
          POSTGRES_DB: gps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:choose-a-password@127.0.0.1:5432/gps
      SOURCE_PMS_BASE_URL: postgresql://postgres:choose-a-password@127.0.0.1:5432
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ARGON2_PEPPER: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create source databases and load fixtures
        run: |
          export PGPASSWORD=choose-a-password
          psql -h 127.0.0.1 -U postgres -d gps -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pms;'
          psql -h 127.0.0.1 -U postgres -d gps -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pms_lakeside;'
          psql -h 127.0.0.1 -U postgres -d pms -v ON_ERROR_STOP=1 -f packages/adapter-read/fixtures/source-pms-seed.sql
          psql -h 127.0.0.1 -U postgres -d pms_lakeside -v ON_ERROR_STOP=1 -f packages/adapter-read/fixtures/source-pms-seed.sql
      - run: pnpm db:migrate
      - run: pnpm --filter @gps/adapter-read exec tsx scripts/seed-connections.ts
      - run: pnpm test:integration

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      # The smoke suite does not touch the database, but Next evaluates the
      # server modules at build time. Dummy values keep the build deterministic;
      # no real connection is opened.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ARGON2_PEPPER: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gps/core exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/core/playwright-report/
          retention-days: 7
